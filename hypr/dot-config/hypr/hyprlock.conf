general {
    hide_cursor = true
}

background {
    monitor =
    color = rgba(1a1a1aff)
}

input-field {
    monitor =
    size = 280, 55
    position = 0, 200

    valign = bottom

    font_family = Aporetic Sans Mono

    rounding = 0

    outline_thickness = 2

    outer_color = rgba(e7a85aff)
    inner_color = rgba(242624ff)
    font_color = rgba(e6e6c2ff)

    check_color = rgba(63b7e9ff)
    fail_color = rgba(e77b5aff)

    placeholder_text = <i>Enter password...</i>
    fade_on_empty = false
}


label {
    monitor =
    text = Welcome back, Brian
    color = rgba(e6e6c2ff)
    font_size = 64

    font_family = Aporetic Serif

    position = 0, 200
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:1000] date +"%H:%M"
    color = rgba(e6e6c2ff)
    font_size = 64

    font_family = Aporetic Sans Mono

    position = 0, 80
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:1000] date +"%d %b %Y"
    color = rgba(e6e6c2ff)
    font_size = 32

    font_family = Aporetic Sans Mono

    position = 0, 0
    halign = center
    valign = center
}
