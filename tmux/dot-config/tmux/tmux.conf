unbind r
bind r source-file ~/.config/tmux/tmux.conf

set -g prefix C-Space

set -g mouse on

# some settings to make sure that colours are correct
set -g default-terminal "xterm-256color"
set-option -ga terminal-overrides ",xterm-256color:Tc"

# Start windows and panes at 1, not 0
set -g base-index 1
setw -g pane-base-index 1

# Status line, panes, and messages.
set -g status-position top
set -g message-style "bg=#272a28,fg=#f4decd"
set -g pane-active-border-style "bg=#0f0f0f,fg=#7ec9a3"
set -g pane-border-style "bg=#0f0f0f,fg=#585f5b"
set -g status-style "bg=#1e1f1e,fg=#b6b69a"

# Active and inactive windows.
setw -g window-status-activity-style none
setw -g window-status-style "bg=#1e1f1e,fg=#b6b69a"
setw -g window-status-current-style "bg=#272a28,fg=#7ec9a3"

setw -g window-status-current-format " #I #[fg=#888e7b]#[fg=default]#W #[fg=#ef934d]#{?window_flags,#{window_flags}, }#[fg=default] "
setw -g window-status-format " #I #W #[fg=#ef934d]#{?window_flags,#{window_flags}, }#[fg=default] "

# Session and hostname.
set -g status-left "#[fg=#efbf71]⠶ #[fg=#7ec9a3]#S#[fg=#888e7b]@#[fg=#f4decd]#h "
unbind %
bind | split-window -h

unbind '"'
bind - split-window -v

bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# stop escape delay
set -sg escape-time 0

